<!DOCTYPE html>
<html>
    <head>
        <title>Practice class</title>
        <style>
            body{
                display:grid;
                grid-template-columns: repeat(4,1fr);
                grid-template-rows: repeat(4,1fr);

            }
            img{
                grid-row: 1/3;
                grid-column: 1/3;
                border: 2px solid black;
                padding: 20px;
                text-align: center;

            }
            .Banner{
                grid-column: 1/5;
                grid-row: 4/5;
                border: 2px solid black;
                padding: 20px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        
        <div class="box">box1</div>
        <div class="box">Box2</div>

    </body>
</html>
