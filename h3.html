<!DOCTYPE html>
<html>
    <head>
        <title>Responsive Nav Bar and Card Grid</title>
    </head>
    <style>
        .cards{
            display:grid;
            justify-content: center;
            
            gap:10px;
            
            

            
            
        }
        .card{
            border:2px solid black;
            padding: 20px;
            text-align:center;
            width:120px;
        }
        .cardas1{
            display: grid;
            justify-self: grid-row-end;
            border:2px solid black;
            padding: 20px;
            text-align:center;
            width:120px;

        }
    </style>
    <body>
        <nav class="cards">
        <div class="cardas1">Card 1</div>
        <div class="card">Card 2</div>
        <div class="card">Card 3</div>
        <div class="card">Card 4</div>
        <div class="card">Card 5</div>
        <div class="card">Card 6</div>
        <div class="card">Card 7</div>
        <div class="card">Card 8</div>
        </nav>

        

        

    </body>
</html>
